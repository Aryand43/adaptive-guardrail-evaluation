# Neutral placeholder attacker prompt for offline tests. It contains no attack strategy.
# Real prompts are curated externally (attacks/templates/external/, git-ignored).
schema_version: "1.0"
policy: attacker_llm
version: "0.1"
system: "PLACEHOLDER attacker system prompt. Turn {{turn}}."
user: |
  PLACEHOLDER objective reference: {{objective}}
  Remaining turns: {{remaining_turns}}
  History:
  {{history}}
  Write the next message.
history_turn: |
  TURN {{turn}}
  ATTACKER: {{attacker_message}}
  TARGET: {{target_response}}
  FEEDBACK: turn={{turn}} refused={{refused}} refusal_type={{refusal_type}} progress={{progress}}
max_message_chars: 2000
