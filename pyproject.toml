[project]
name = "adaptive-guardrail-evaluation"
version = "0.1.0"
description = "Controlled evaluation of adaptive multi-turn attacks against LLM safety mechanisms under matched budgets."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "configs", "datasets", "models", "attacks", "orchestrator", "evaluators",
    "metrics", "storage", "dashboard", "experiments", "analysis",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
