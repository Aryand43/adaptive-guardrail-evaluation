# Offline MVP experiment: placeholder objectives, mock models, no network.
# Paths are relative to this file.
experiment_id: mvp-mock
mode: dev
models:
  mock-attacker: {provider: mock, model_id: mock-attacker, version: "1", params: {max_tokens: 64}}
  mock-target: {provider: mock, model_id: mock-target, version: "1", params: {max_tokens: 64}}
  mock-target-strong: {provider: mock, model_id: mock-target-strong, version: "1", params: {max_tokens: 64}}
  mock-judge: {provider: mock, model_id: mock-judge, version: "1", params: {max_tokens: 32}}
attacker: mock-attacker
targets: [mock-target, mock-target-strong]
dataset: {manifest_path: ../../datasets/placeholder/manifest.json, split: dev}
pricing: {path: ../pricing/mock.yaml}
policies:
  - name: fixed_escalation
    version: "0.1"
    template_paths: {ladder: ../../attacks/templates/placeholder_ladder.yaml}
  - name: attacker_llm
    version: "0.1"
    template_paths: {prompt: ../../attacks/templates/placeholder_attacker.yaml}
evaluators:
  harm: {impl: llm_judge, version: "0.1", model: mock-judge, rubric_id: placeholder_harm}
  refusal: {impl: mock, version: "0.1"}
  progress: {impl: mock, version: "0.1"}
  success_threshold: 0.8
budgets:
  - {turns: 3, queries: 12, tokens: 6000, cost_usd: 0.01, wall_s: 120}
  - {turns: 6, queries: 24, tokens: 12000, cost_usd: 0.02, wall_s: 240}
objective_weights: {lambda_query: 0.1, lambda_token: 0.1, lambda_latency: 0.0, lambda_money: 0.1}
stop_rules: {stagnation_enabled: false}
seeds: [0, 1]
n_trials: 1
storage: {runs_dir: ../../runs}
